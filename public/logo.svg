<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="discountglitch">
  <defs>
    <!-- Soft App Store–style vertical gloss -->
    <linearGradient id="dgIconBg" x1="24" y1="8" x2="104" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A84FF"/>
      <stop offset="0.55" stop-color="#0071E3"/>
      <stop offset="1" stop-color="#0058B0"/>
    </linearGradient>
    <linearGradient id="dgSheen" x1="64" y1="8" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dgSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- iOS-like continuous corner (~22.5% squircle approx) -->
  <rect width="128" height="128" rx="28.5" fill="url(#dgIconBg)" filter="url(#dgSoft)"/>
  <rect width="128" height="64" rx="28.5" fill="url(#dgSheen)"/>
  <!-- Minimal ticket / reward mark -->
  <path
    fill="#fff"
    fill-rule="evenodd"
    d="M30 46c0-4.4 3.6-8 8-8h52c4.4 0 8 3.6 8 8v8.2c-3.3.9-5.7 3.9-5.7 7.4s2.4 6.5 5.7 7.4V84c0 4.4-3.6 8-8 8H38c-4.4 0-8-3.6-8-8v-7c3.3-.9 5.7-3.9 5.7-7.4S33.3 55.1 30 54.2V46zm18 6.5a3.5 3.5 0 100 7h32a3.5 3.5 0 100-7H48zm0 16a3.5 3.5 0 100 7h20a3.5 3.5 0 100-7H48z"
  />
</svg>
